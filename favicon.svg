<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      @media (prefers-color-scheme: light) {
        .tile { fill: #f0effe; }
        .label { fill: #06060d; }
      }
      @media (prefers-color-scheme: dark) {
        .tile { fill: #06060d; }
        .label { fill: #f0effe; }
      }
    </style>
  </defs>
  <rect class="tile" width="32" height="32" rx="6"/>
  <text class="label" x="16" y="22" font-family="'Space Mono','Courier New',monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="-0.5">FM</text>
</svg>
